<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page reach under a notch; the safe-area
         insets in index.css then keep content out from under it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colours the browser chrome on Android and iOS PWAs to match the theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131119" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FlagForge</title>
    <!--
      Archivo does all the typesetting. It is a variable font with a width
      axis, so page titles are the same face as body text cut wider (112%)
      and heavier rather than a second family bolted on — a serif paired
      with a sans is the tell of a template, and one family working across
      two optical widths is a type system.

      There is no second family. Flag keys and environment names are
      identifiers, not code samples, so they are set in Archivo like everything
      else and marked as identifiers by weight, tracking and a tinted chip
      instead of by a monospace face. Raw payloads — the API sample on the
      landing page, JSON in an audit diff — use the operating system's own
      mono, which is already installed and needs no download.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before the first paint. React sets these attributes too, but only
      // after hydration — without this the page flashes white on every load for
      // anyone using the dark theme.
      ;(function () {
        try {
          var stored = localStorage.getItem('flagforge.theme')
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'

          var language = localStorage.getItem('flagforge.language')
          if (language) {
            document.documentElement.lang = language
            if (['ar', 'ur', 'fa', 'he'].indexOf(language) !== -1) {
              document.documentElement.dir = 'rtl'
            }
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body class="bg-bg text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
