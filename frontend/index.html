<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlagForge — Feature Flag & Release Console</title>
    <meta
      name="description"
      content="Create feature flags, target users and groups, roll out gradually, and flip behaviour per environment without a deploy."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M11 8h11l-2.2 4.2L22 16.4H13v7.6h-2z' fill='white'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so a dark-theme reload never flashes light.
      (function () {
        try {
          var stored = localStorage.getItem('flagforge:theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body class="bg-canvas font-sans text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
