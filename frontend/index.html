<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlagForge</title>
    <!--
      One superfamily, three voices: Source Serif 4 for titles, Source Sans 3
      for the interface, Source Code Pro for anything the API produced. They
      were drawn against each other, so a flag key in mono and its description
      in sans share a skeleton. All three are humanist rather than geometric —
      the letters have the slight irregularity of writing, which is what keeps
      a dense console from reading as machine output.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Source+Code+Pro:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before the first paint. React sets these attributes too, but only
      // after hydration — without this the page flashes white on every load for
      // anyone using the dark theme.
      ;(function () {
        try {
          var stored = localStorage.getItem('flagforge.theme')
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'

          var language = localStorage.getItem('flagforge.language')
          if (language) {
            document.documentElement.lang = language
            if (['ar', 'ur', 'fa', 'he'].indexOf(language) !== -1) {
              document.documentElement.dir = 'rtl'
            }
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body class="bg-bg text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
