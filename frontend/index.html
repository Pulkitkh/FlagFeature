<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlagForge</title>
    <!--
      Newsreader for titles, IBM Plex Sans and Mono for everything else.
      Plex Sans and Plex Mono are one superfamily drawn together, so the
      interface text and the API values sit on the same skeleton; Newsreader
      gives page titles a voice without turning the console into a magazine.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before the first paint. React sets these attributes too, but only
      // after hydration — without this the page flashes white on every load for
      // anyone using the dark theme.
      ;(function () {
        try {
          var stored = localStorage.getItem('flagforge.theme')
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'

          var language = localStorage.getItem('flagforge.language')
          if (language) {
            document.documentElement.lang = language
            if (['ar', 'ur', 'fa', 'he'].indexOf(language) !== -1) {
              document.documentElement.dir = 'rtl'
            }
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body class="bg-bg text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
