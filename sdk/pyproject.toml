[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flagforge"
version = "1.0.0"
description = "In-memory caching client for the FlagForge feature flag service"
readme = "README.md"
requires-python = ">=3.10"
# No runtime dependencies on purpose: the standard library is enough, so
# installing this into an application can't cause a version conflict.
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100", "uvicorn>=0.23"]
django = ["django>=4.2"]

[tool.setuptools.packages.find]
include = ["flagforge*"]
